name:                rust-notebook-language-server
version:             0.2.12.0

extra-source-files:
- README.md
- CHANGELOG.md

dependencies:
- base >= 4.7 && < 5
# - language-rust
- lsp-types >= 2.0.0.1
- monad-logger
- string-interpolate
- text
- unliftio

default-extensions:
- OverloadedStrings
- QuasiQuotes
- NamedFieldPuns
- RecordWildCards
- ScopedTypeVariables
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- ViewPatterns
- MultiParamTypeClasses
- MultiWayIf
- TupleSections
- NumericUnderscores
- TypeApplications

ghc-options:
- -Wunused-packages
- -Wall
- -fno-warn-name-shadowing

library:
  source-dirs: src
  dependencies:
  - containers
  - filepath
  - lens
  - mtl
  - notebook-language-server-core
  - pcre-light
  - text-rope

executables:
  rust-notebook-language-server:
    main: Main.hs
    source-dirs:
    - app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    dependencies:
    - aeson
    - bytestring
    - lens
    - mtl
    - notebook-language-server-core
    - optparse-applicative
    - rust-notebook-language-server
    - safe
    - unix
    - unliftio-core

tests:
  rust-notebook-language-server-test:
    main: Main.hs
    source-dirs:
    - test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    build-tools: sandwich:sandwich-discover
    dependencies:
    - containers
    - exceptions
    - mtl
    - myers-diff
    - notebook-language-server-core
    - QuickCheck
    - quickcheck-instances
    - rust-notebook-language-server
    - sandwich
    - sandwich-quickcheck
    - text-rope
    - uuid
